name: limpieza
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  borrar-viejos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Borrar carpetas de mas de 30 dias
        run: |
          set -eu
          [ -d archivos ] || exit 0
          LIM=$(date -u -d '30 days ago' +%Y-%m-%d)
          for d in archivos/*/; do
            f=$(basename "$d")
            if [ "$f" \< "$LIM" ]; then git rm -rq "$d"; fi
          done
          git config user.name "dx-descargador"
          git config user.email "dx-descargador@users.noreply.github.com"
          git commit -m "Limpieza 30 dias" || exit 0
          git push
