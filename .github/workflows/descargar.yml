name: descargar
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Link de descarga del adjunto"
        required: true
      nombre:
        description: "Carpeta destino (letras, numeros, guiones)"
        required: true
permissions:
  contents: write
concurrency:
  group: descargar
  cancel-in-progress: false
jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Bajar y convertir
        env:
          URL: ${{ inputs.url }}
          NOMBRE: ${{ inputs.nombre }}
        run: |
          set -euo pipefail
          N=$(printf '%s' "$NOMBRE" | tr -cd 'A-Za-z0-9._-' | cut -c1-80)
          [ -n "$N" ] || { echo "nombre invalido"; exit 1; }
          D="archivos/$(date -u +%Y-%m-%d)/$N"
          mkdir -p "$D"
          curl -sSfL --max-time 300 --max-filesize 95000000 -o "$D/original" "$URL"
          T=$(file -b --mime-type "$D/original")
          echo "$T" > "$D/tipo.txt"
          if [ "$T" = "application/pdf" ]; then
            mv "$D/original" "$D/original.pdf"
            pdftoppm -r 110 -jpeg -jpegopt quality=80 "$D/original.pdf" "$D/p"
            pdftotext -layout "$D/original.pdf" "$D/texto.txt" || true
          fi
          ls -la "$D"
      - name: Guardar
        run: |
          git config user.name "dx-descargador"
          git config user.email "dx-descargador@users.noreply.github.com"
          git add archivos
          git commit -m "Descarga ${{ github.run_id }}" || exit 0
          git push
